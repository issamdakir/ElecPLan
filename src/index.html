<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:">
<title>ElecPlan</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><b>Elec</b>Plan</div>
  <input id="projName" class="projname" value="Nouveau projet" aria-label="Nom du projet">
  <div class="filebtns">
    <button id="bNew" title="Nouveau (Ctrl+N)">Nouveau</button>
    <button id="bOpen" title="Ouvrir (Ctrl+O)">Ouvrir</button>
    <button id="bSave" title="Enregistrer (Ctrl+S)">Enregistrer</button>
    <button id="bBg" title="Importer un fond de plan (image ou PDF)">Fond de plan</button>
    <button id="bPdf" class="primary" title="Exporter en PDF A3 (Ctrl+P)">Exporter PDF</button>
  </div>
  <div class="levels" id="levels" role="tablist" aria-label="Niveaux"></div>
  <span class="dirty" id="dirty" hidden>● non enregistré</span>
</header>

<div class="main">
  <nav class="tools" id="tools" aria-label="Outils">
    <div class="tgroup"><span>Vue</span>
      <button data-tool="select" title="Sélection / déplacer (V)"><i>⌖</i>Sélection</button>
      <button data-tool="pan" title="Main : déplacer la vue (H, ou clic molette)"><i>✋</i>Vue</button>
    </div>
    <div class="tgroup"><span>Architecture</span>
      <button data-tool="wall" title="Mur : clics successifs, double-clic ou Entrée pour finir (W)"><i>▬</i>Mur</button>
      <button data-tool="room" title="Pièce : clics sur les angles, double-clic pour fermer (R)"><i>▢</i>Pièce</button>
      <button data-tool="door" title="Porte : clic pour placer, molette ou R pour tourner (D)"><i>◜</i>Porte</button>
      <button data-tool="window" title="Fenêtre : clic pour placer (F)"><i>≡</i>Fenêtre</button>
      <button data-tool="dim" title="Cote : 2 clics (C)"><i>↔</i>Cote</button>
      <button data-tool="text" title="Texte (T)"><i>A</i>Texte</button>
    </div>
    <div class="tgroup"><span>Électricité</span>
      <button data-tool="device" title="Appareil : choisir le type dans le panneau, puis cliquer (E)"><i>⊗</i>Appareil</button>
      <button data-tool="gaine" title="Gaine : clic sur l'appareil de départ, coudes, clic sur l'arrivée (G)"><i>⤳</i>Gaine</button>
    </div>
    <div class="tgroup"><span>Fond</span>
      <button data-tool="calib" title="Mettre le fond à l'échelle : 2 clics + distance réelle"><i>⟷</i>Échelle</button>
    </div>
  </nav>

  <section class="canvaswrap" id="canvaswrap">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg" aria-label="Plan"></svg>
    <div class="hint" id="hint"></div>
    <div class="zoombox">
      <button id="zIn" title="Zoomer">+</button><button id="zOut" title="Dézoomer">−</button><button id="zFit" title="Tout voir">⤢</button>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="props" aria-selected="true">Propriétés</button>
      <button role="tab" data-tab="lib" aria-selected="false">Appareils</button>
      <button role="tab" data-tab="nomen" aria-selected="false">Nomenclature</button>
      <button role="tab" data-tab="ai" aria-selected="false">Assistant IA</button>
    </div>
    <div class="tabbody" id="tab-props"></div>
    <div class="tabbody" id="tab-lib" hidden></div>
    <div class="tabbody" id="tab-nomen" hidden></div>
    <div class="tabbody" id="tab-ai" hidden></div>
  </aside>
</div>

<footer class="status">
  <span id="sCoord">x 0,00 · y 0,00 m</span>
  <span id="sZoom">100 %</span>
  <label><input type="checkbox" id="optSnap" checked> Grille</label>
  <label>pas <select id="optGrid"><option value="5">5 cm</option><option value="10" selected>10 cm</option><option value="25">25 cm</option><option value="50">50 cm</option></select></label>
  <label><input type="checkbox" id="optOrtho" checked> Angles 15° (Maj = libre)</label>
  <label>mur <select id="optThick"><option value="10">10 cm</option><option value="15">15 cm</option><option value="20" selected>20 cm</option><option value="25">25 cm</option><option value="30">30 cm</option></select></label>
  <span class="layersel">
    <label><input type="checkbox" data-layer="bg" checked> Fond</label>
    <label><input type="checkbox" data-layer="archi" checked> Archi</label>
    <label><input type="checkbox" data-layer="elec" checked> Électrique</label>
    <label><input type="checkbox" data-layer="gaines" checked> Gaines</label>
    <label><input type="checkbox" data-layer="dims" checked> Cotes</label>
  </span>
  <span class="sp"></span>
  <span id="sMsg"></span>
</footer>

<script src="model.js"></script>
<script src="symbols.js"></script>
<script src="app.js"></script>
<script src="ai.js"></script>
<script type="module" src="pdfbg.js"></script>
</body>
</html>
